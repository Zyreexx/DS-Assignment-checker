<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment progress Checker by Pushp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="eyebrow">LEETCODE ASSIGNMENT of DS</div>
    <h1>Assignment progress<br> Checker by Pushp</h1>
    <p id="summary">Open LeetCode and check your assignment.</p>
  </header>
  <main id="results" aria-live="polite">
    <button id="check" type="button">Check progress</button>
    <div id="message" role="status"></div>
    <div id="list"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
